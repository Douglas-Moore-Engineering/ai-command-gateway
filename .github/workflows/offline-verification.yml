name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Offline checks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.10'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.lock -r requirements-azure.lock
      - name: Install project without dependency resolution
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Verify offline software and fixtures
        run: python scripts/verify_offline_ci.py --require-powershell
