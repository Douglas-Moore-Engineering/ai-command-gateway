[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-command-gateway"
version = "0.4.0"
description = "Offline industrial command validation and source qualification reference"
requires-python = ">=3.10"
dependencies = ["pyarrow>=25,<27", "scipy>=1.15,<2", "h5py>=3.14,<4"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
azure = ["azure-identity==1.26.0", "azure-storage-blob==12.31.0"]

[project.scripts]
ai-command-gateway = "ai_command_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

